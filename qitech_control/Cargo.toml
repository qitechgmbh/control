[package]
name = "qitech_control"
version = "0.1.0"
edition = "2024"

[dependencies]
qitech_lib = { workspace = true }
qitech_framework = { workspace = true }
qitech_framework_tui = { workspace = true }

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"]}
heapless = { version = "0.8.0", features = ["serde"]}
serialport = "4.9.0"
udev = "0.9.3"
euclid = "0.22.13"
bitvec = "1.1.1"
libc = "0.2.186"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
approx = "0.5.1"

[features]
mock-machine = []
