[package]
name = "qitech_control"
version = "0.1.0"
edition = "2024"

[dependencies]
qitech_lib = { workspace = true }
qitech_control_core = { workspace = true }
qitech_framework = { workspace = true }
qitech_framework_tui = { workspace = true }
qitech_framework_hub = { workspace = true }

tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors","trace"] } 
tracing.workspace = true
tracing-subscriber.workspace = true

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"] }
heapless = { version = "0.9.3", features = ["serde"] }
serialport = "4.9.0"
arc-swap = "1.9.2"
axum = "0.8.9"
euclid = "0.22.13"
bitvec = "1.1.1"
crc = "3.3.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
erased-serde = "0.4.10"
socketioxide = { version = "0.16", features = ["msgpack"] }

[dev-dependencies]
approx = "0.5.1"

[features]
mock-machine = []
