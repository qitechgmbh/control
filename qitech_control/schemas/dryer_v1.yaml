qms_version: 1.0
revision: 1

identification:
  name: dryer_v1
  vendor_id: 1
  machine_id: 16

config:
  target_temperature: !degree_celsius
  # Manual air volume setpoint (raw device unit, no physical quantity documented yet).
  air_volume: !integer
  # Only used on days with no scheduled stop time (see schedule below).
  drying_timer_minutes: !integer

  schedule:
    monday:
      start_minutes: !integer
      stop_minutes: !integer
    tuesday:
      start_minutes: !integer
      stop_minutes: !integer
    wednesday:
      start_minutes: !integer
      stop_minutes: !integer
    thursday:
      start_minutes: !integer
      stop_minutes: !integer
    friday:
      start_minutes: !integer
      stop_minutes: !integer
    saturday:
      start_minutes: !integer
      stop_minutes: !integer
    sunday:
      start_minutes: !integer
      stop_minutes: !integer

state:
  # Raw device status code (0=starting, 1=standby, 2=heating, 3=starting up, 4=drying,
  # 5=cooling, 6=fan stop, 7=finishing, 9=switching - 8 is unused by the hardware).
  status: !integer
  alarm: !integer
  warning: !integer
  # Probed from holding register 2000 at connect time - not a separate machine type.
  is_smart: !boolean

measurements:
  temp_process: !degree_celsius
  temp_safety: !degree_celsius
  temp_regen_in: !degree_celsius
  temp_regen_out: !degree_celsius
  temp_fan_inlet: !degree_celsius
  temp_return_air: !degree_celsius
  temp_dew_point: !degree_celsius
  pwm_fan1: !percentage
  pwm_fan2: !percentage
  power_process: !float
  power_regen: !float
  # Seconds left until the dryer stops itself; null if nothing is counting down.
  remaining_seconds: !?integer

commands:
  start: !command
  stop: !command

events:
  alarm_raised: !event
