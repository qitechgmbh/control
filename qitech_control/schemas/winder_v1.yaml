qms_version: 1.0
revision: 1

identification:
  name: winder_v1
  vendor_id: 1
  machine_id: 2

config:
  spool:
    direction: !enum [forward, reverse]

    speed_controller:
      algorithm: !enum [adaptive, min_max]

      speed_min: !revolution_per_minute
      speed_max: !revolution_per_minute

      adaptive:
        tension_target: !float
        radius_learning_rate: !float
        max_speed_multiplier: !float
        acceleration_factor: !float
        deacceleration_urgency_multiplier: !float

  puller:
    direction: !enum [
      forward,
      reverse,
    ]

    gear_ratio: !enum [
      one_to_one,
      one_to_five,
      one_to_ten,
    ]

    speed_controller:
      algorithm: !enum [direct, adaptive]
      speed_desired: !meter_per_minute

      adaptive:
        speed_delta_max: !float
        increase_per_step: !float
        tolerance_limit: !millimeter
        adjustment_distance: !meter

  traverse:
    limit_inner: !millimeter
    limit_outer: !millimeter
    step_size: !millimeter
    padding: !millimeter


state:
  mode: !enum [standby, pull, hold, wind]

  spool:
    mode: !enum [standby, hold, wind]

    speed_controller:
      enabled: !boolean

  puller:
    mode: !enum [standby, hold, pull]

  traverse:
    mode: !enum [
      standby,
      hold,
      traverse
    ]

    state: !enum [
      idle,
      going_in,
      going_out,
      initialize,
      escape_endstop,
      find_endstop_fine_distancing,
      find_endstop_coarse,
      find_endstop_fine,
      validate,
      traversing_in,
      traversing_out
    ]

    homed: !boolean
    endstop_triggered: !boolean

  tension_arm:
    zero: !?revolution

  laser_pointer:
    enabled: !boolean

measurements:
  spool:
    rpm: !revolution_per_minute
    progress: !meter

    speed_controller:
      speed: !revolution_per_minute
      filament_tension: !?float

      adaptive:
        speed_factor: !meter

  puller:
    speed: !meter_per_minute

    speed_controller:
      speed_target: !meter_per_minute

      adaptive:
        modulation: !float
        distance_since_adjustment: !meter

  traverse:
    position: !millimeter

  tension_arm:
    angle: !revolution

  laser_pointer:
    enabled: !boolean

measurements:
  spool:
    rpm: !revolution_per_minute
    progress: !meter

    speed_controller:
      speed: !revolution_per_minute
      filament_tension: !?float

      adaptive:
        speed_factor: !meter

  puller:
    speed: !meter_per_minute

    speed_controller:
      speed_target: !meter_per_minute

      adaptive:
        modulation: !float
        distance_since_adjustment: !meter

  traverse:
    position: !millimeter

  tension_arm:
    angle: !revolution

commands:
  mode:
    standby: !command
    hold: !command
    pull: !command
    wind: !command

  spool:
    reset_progress: !command

  traverse:
    goto_home: !command
    goto_limit_inner: !command
    goto_limit_outer: !command

  tension_arm:
    set_zero: !command

  laser_pointer:
    enable: !command
    disable: !command
