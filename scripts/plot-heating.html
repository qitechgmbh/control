<!doctype html>
<meta charset="utf-8" />
<title>Extruder heating</title>
<!--
  Plots a CSV written by:
    cargo run --release -p machine_implementations \
      --example extruder_thermal_sim -- --scenario cold-start --out heating.csv

  Open this file in a browser and drop the CSV on it. No dependencies, no server;
  the file never leaves your machine.

  Also reads the recorded-run format (data/heatup_2026-02-24.csv and anything
  scripts/record-extruder.mjs writes), so you can plot a real run the same way.
-->
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --dim: #767676; --grid: #e2e2e2; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --dim: #9a9a9a; --grid: #333; --bg: #161616; }
  }
  body { margin: 0; padding: 20px; font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
         color: var(--fg); background: var(--bg); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  #bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  select, input[type=file] { font: inherit; color: inherit; }
  #legend { display: flex; gap: 14px; flex-wrap: wrap; }
  #legend label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  #legend input { margin: 0; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; }
  #drop { border: 1.5px dashed var(--grid); border-radius: 8px; padding: 40px; text-align: center;
          color: var(--dim); }
  #drop.over { border-color: var(--fg); color: var(--fg); }
  #chart { width: 100%; height: auto; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { fill: var(--dim); font-size: 11px; }
  .line { fill: none; stroke-width: 1.6; }
  #readout { color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.5em; }
</style>

<h1>Extruder heating</h1>

<div id="bar">
  <input type="file" id="file" accept=".csv,text/csv" />
  <label>show <select id="group"></select></label>
  <span id="legend"></span>
</div>
<div id="readout"></div>
<div id="drop">drop a CSV here</div>
<svg id="chart" viewBox="0 0 900 460" hidden></svg>

<script>
  const ZONES = ["front", "middle", "back", "nozzle"];
  const COLORS = { front: "#2f7ed8", middle: "#d9534f", back: "#3f9a52", nozzle: "#b36ae2" };
  // Column prefix -> axis label. `T` covers the recorded-run format.
  const UNITS = { sensor: "°C", steel: "°C", band: "°C", T: "°C", duty: "0-1", power_w: "W" };
  const M = { l: 52, r: 14, t: 12, b: 34 }, W = 900, H = 460;

  let data = null, hidden = new Set();

  function parseCsv(text) {
    const lines = text.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
    const head = lines[0].split(",").map(s => s.trim());
    const cols = Object.fromEntries(head.map(h => [h, []]));
    for (const line of lines.slice(1)) {
      const cells = line.split(",");
      if (cells.length !== head.length) continue;
      head.forEach((h, i) => cols[h].push(+cells[i]));
    }
    // Group columns by their prefix: "sensor_front" -> sensor / front.
    const groups = {};
    for (const h of head) {
      const zone = ZONES.find(z => h.endsWith("_" + z));
      if (!zone) continue;
      const prefix = h.slice(0, -(zone.length + 1));
      (groups[prefix] ??= {})[zone] = cols[h];
    }
    return { t: cols.t_s ?? [], groups };
  }

  function render() {
    if (!data) return;
    const svg = document.getElementById("chart");
    const prefix = document.getElementById("group").value;
    const series = data.groups[prefix] ?? {};
    const shown = ZONES.filter(z => series[z] && !hidden.has(z));

    const t = data.t;
    const xMax = t[t.length - 1] || 1;
    let lo = Infinity, hi = -Infinity;
    for (const z of shown) for (const v of series[z]) {
      if (Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
    }
    if (!Number.isFinite(lo)) { lo = 0; hi = 1; }
    const pad = (hi - lo) * 0.06 || 1;
    lo -= pad; hi += pad;

    const x = s => M.l + (s / xMax) * (W - M.l - M.r);
    const y = v => H - M.b - ((v - lo) / (hi - lo)) * (H - M.t - M.b);

    const parts = [];
    for (let i = 0; i <= 5; i++) {
      const v = lo + ((hi - lo) * i) / 5, yy = y(v);
      parts.push(`<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${yy}" y2="${yy}"/>`);
      parts.push(`<text class="axis" x="${M.l - 7}" y="${yy + 4}" text-anchor="end">${
        Math.abs(hi - lo) < 3 ? v.toFixed(2) : v.toFixed(0)}</text>`);
    }
    for (let i = 0; i <= 6; i++) {
      const s = (xMax * i) / 6, xx = x(s);
      parts.push(`<line class="grid" x1="${xx}" x2="${xx}" y1="${M.t}" y2="${H - M.b}"/>`);
      parts.push(`<text class="axis" x="${xx}" y="${H - M.b + 17}" text-anchor="middle">${
        (s / 60).toFixed(0)}m</text>`);
    }
    parts.push(`<text class="axis" x="${M.l - 7}" y="${M.t + 2}" text-anchor="end">${
      UNITS[prefix] ?? ""}</text>`);

    // One point per horizontal pixel is plenty; the CSV is 1 Hz over an hour.
    const stride = Math.max(1, Math.ceil(t.length / (W - M.l - M.r)));
    for (const z of shown) {
      const d = [];
      for (let i = 0; i < t.length; i += stride) d.push(`${x(t[i]).toFixed(1)},${y(series[z][i]).toFixed(1)}`);
      parts.push(`<polyline class="line" stroke="${COLORS[z]}" points="${d.join(" ")}"/>`);
    }
    parts.push(`<line id="cross" class="grid" y1="${M.t}" y2="${H - M.b}" x1="-9" x2="-9"/>`);
    svg.innerHTML = parts.join("");
    svg.hidden = false;
    document.getElementById("drop").hidden = true;

    svg.onmousemove = e => {
      const r = svg.getBoundingClientRect();
      const sx = ((e.clientX - r.left) / r.width) * W;
      const secs = ((sx - M.l) / (W - M.l - M.r)) * xMax;
      let i = Math.round((secs / xMax) * (t.length - 1));
      i = Math.min(t.length - 1, Math.max(0, i));
      svg.querySelector("#cross").setAttribute("x1", x(t[i]));
      svg.querySelector("#cross").setAttribute("x2", x(t[i]));
      document.getElementById("readout").textContent =
        `t = ${(t[i] / 60).toFixed(1)} min   ` +
        shown.map(z => `${z} ${series[z][i].toFixed(2)}`).join("   ");
    };
  }

  function load(text) {
    data = parseCsv(text);
    const prefixes = Object.keys(data.groups);
    const sel = document.getElementById("group");
    sel.innerHTML = prefixes.map(p => `<option>${p}</option>`).join("");
    // Prefer what the controller actually reacts to.
    sel.value = prefixes.includes("sensor") ? "sensor" : prefixes[0];
    document.getElementById("legend").innerHTML = ZONES.map(z =>
      `<label><input type="checkbox" data-zone="${z}" checked>
       <span class="swatch" style="background:${COLORS[z]}"></span>${z}</label>`).join("");
    document.querySelectorAll("#legend input").forEach(cb => {
      cb.onchange = () => {
        cb.checked ? hidden.delete(cb.dataset.zone) : hidden.add(cb.dataset.zone);
        render();
      };
    });
    render();
  }

  document.getElementById("group").onchange = render;
  document.getElementById("file").onchange = e => {
    const f = e.target.files[0];
    if (f) f.text().then(load);
  };
  const drop = document.getElementById("drop");
  for (const ev of ["dragenter", "dragover"]) {
    document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); });
  }
  document.addEventListener("dragleave", () => drop.classList.remove("over"));
  document.addEventListener("drop", e => {
    e.preventDefault();
    drop.classList.remove("over");
    const f = e.dataTransfer.files[0];
    if (f) f.text().then(load);
  });
</script>
