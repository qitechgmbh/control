qms_version: 1.0
revision: 1

identification:
  name: winder_v1
  vendor_id: 1
  machine_id: 2

config:
  traverse:
    limit_inner: !millimeter
      default: 22.0

    limit_outer: !millimeter
      default: 92.0

    step_size: !millimeter
      default: 1.75

    padding: !millimeter
      default: 0.88

  puller:
    regulation_mode: !enum
      variants: [speed, diameter]
      default: speed

    target_speed: !meter_per_minute
      default: 1.0

    forward: !boolean
      default: true

    gear_ratio: !enum
      variants: [one_to_one, one_to_five, one_to_ten]
      default: one_to_one

    adapative:
      max_speed_change_percent: !float
        default: 33.0

      adjustment_interval: !meter
        default: 0.5

      step_percent: !float
        default: 3.3

      accepted_difference: !millimeter
        default: 0.01

  spool:
    adaptive:
      tension_target: !float
        default: 0.7

      radius_learning_rate: !float
        default: 0.5

      max_speed_multiplier: !float
        default: 4.0

      acceleration_factor: !float
        default: 0.2

      deacceleration_urgency_multiplier: !float
        default: 15.0

  spool_automatic:
    required_meters: !meter
      default: 250.0

    action: !enum
      variants: [no_action, pull, hold]
      default: no_action

state:
  traverse:
    limit_inner: !millimeter
    limit_outer: !millimeter
    is_going_in: !boolean
    is_going_out: !boolean
    is_homed: !boolean
    is_going_home: !boolean
    is_traversing: !boolean
    laserpointer: !boolean
    step_size: !millimeter
    padding: !millimeter
    can_go_in: !boolean
    can_go_out: !boolean
    can_go_home: !boolean

  puller:
    regulation: !enum
      variants: [speed, diameter]

    target_speed: !meter_per_minute
    forward: !boolean

    gear_ratio: !enum 
      variants: [one_to_one, one_to_five, one_to_ten]

    adaptive_speed_delta_max: !float
    adaptive_adjustment_distance: !millimeter
    adaptive_change_per_step: !float
    allowed_diameter_deviation: !millimeter

  spool_automatic_action:
    spool_required_meters: !meter
    spool_automatic_action_mode: !enum
      variants: [no_action, pull, hold]

  mode:
    mode: !enum
      variants: [standby, pull, hold, wind]

    can_wind: !boolean

  tension_arm:
    zeroed: !boolean

  spool_speed_controller:
    regulation_mode: !enum
      variants: [adaptive, minmax]

    minmax_min_speed: !revolution_per_minute
    minmax_max_speed: !revolution_per_minute
    adaptive_tension_target: !float
    adaptive_radius_learning_rate: !float
    adaptive_max_speed_multiplier: !float
    adaptive_acceleration_factor: !float
    adaptive_deacceleration_urgency_multiplier: !float
    forward: !boolean

measurements:
  traverse:
    position: !millimeter
      nullable: true

  puller: 
    speed: !meter_per_minute
      
  spool: 
    rpm: !revolution_per_minute

    progress: !meter

  tension_arm: 
    angle: !degree

commands:
  set_mode:
    standby: !command
    hold: !command
    pull: !command
    wind: !command

  traverse:
    laserpointer:
      enable: !command
      disable: !command

    goto_home: !command
    goto_limit_inner: !command
    goto_limit_outer: !command

  tension_arm: 
    set_zero: !command
