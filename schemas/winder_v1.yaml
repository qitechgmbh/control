qms_version: 1.0
revision: 1

identification:
  name: winder_v1
  vendor_id: 1
  machine_id: 2

config:
  traverse:
    limit_inner: !millimeter
    limit_outer: !millimeter
    step_size: !millimeter
    padding: !millimeter

  puller:
    regulation_mode: !enum [speed, diameter]
    gear_ratio: !enum [one_to_one, one_to_five, one_to_ten]

    target_speed: !meter_per_minute
    forward: !boolean

    adapative:
      max_speed_change_percent: !float
      adjustment_interval: !meter
      step_percent: !float
      accepted_difference: !millimeter

  spool:
    adaptive:
      tension_target: !float
      radius_learning_rate: !float
      max_speed_multiplier: !float
      acceleration_factor: !float
      deacceleration_urgency_multiplier: !float

  spool_automatic:
    required_meters: !meter

    action: !enum [no_action, pull, hold]

state:
  traverse:
    limit_inner: !millimeter
    limit_outer: !millimeter
    is_going_in: !boolean
    is_going_out: !boolean
    is_homed: !boolean
    is_going_home: !boolean
    is_traversing: !boolean
    laserpointer: !boolean
    step_size: !millimeter
    padding: !millimeter
    can_go_in: !boolean
    can_go_out: !boolean
    can_go_home: !boolean

  puller:
    regulation: !enum [speed, diameter]

    target_speed: !meter_per_minute
    forward: !boolean

    gear_ratio: !enum [one_to_one, one_to_five, one_to_ten]

    adaptive_speed_delta_max: !float
    adaptive_adjustment_distance: !millimeter
    adaptive_change_per_step: !float
    allowed_diameter_deviation: !millimeter

  spool_automatic_action:
    spool_required_meters: !meter
    spool_automatic_action_mode: !enum [no_action, pull, hold]

  mode:
    mode: !enum [standby, pull, hold, wind]

    can_wind: !boolean

  tension_arm:
    zeroed: !boolean

  spool_speed_controller:
    regulation_mode: !enum [adaptive, minmax]

    minmax_min_speed: !revolution_per_minute
    minmax_max_speed: !revolution_per_minute
    adaptive_tension_target: !float
    adaptive_radius_learning_rate: !float
    adaptive_max_speed_multiplier: !float
    adaptive_acceleration_factor: !float
    adaptive_deacceleration_urgency_multiplier: !float
    forward: !boolean

measurements:
  traverse:
    position: !?millimeter

  puller: 
    speed: !meter_per_minute
      
  spool: 
    rpm: !revolution_per_minute

    progress: !meter

  tension_arm: 
    angle: !degree

commands:
  set_mode:
    standby: !command
    hold: !command
    pull: !command
    wind: !command

  traverse:
    laserpointer:
      enable: !command
      disable: !command

    goto_home: !command
    goto_limit_inner: !command
    goto_limit_outer: !command

  tension_arm: 
    set_zero: !command
