    limit_outer: !millimeter
    is_going_in: !boolean
    is_going_out: !boolean
    is_homed: !boolean
    is_going_home: !boolean
    is_traversing: !boolean
    laserpointer: !boolean
    step_size: !millimeter
    padding: !millimeter
