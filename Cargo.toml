[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git="https://github.com/qitechgmbh/qitech_lib", rev="664720b199158a85bde90d9f6a3754fa2f72a1be" }

# --- framework ---
qitech_framework = { git="https://github.com/qitechgmbh/qitech_framework", rev="17b202ac3a932ba393b80168dfc93125f9487aec" }
qitech_framework_tui = { git="https://github.com/qitechgmbh/qitech_framework", rev="17b202ac3a932ba393b80168dfc93125f9487aec" }
qitech_framework_hub = { git="https://github.com/qitechgmbh/qitech_framework", rev="17b202ac3a932ba393b80168dfc93125f9487aec" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
