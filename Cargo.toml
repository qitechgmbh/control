[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="1cb01be2b3d59cf4d4a3d26111ffbd758bf99cae" }

# --- framework ---
qitech_framework = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="8a7ae85ffea74aa68cc533c831a0f0295fb890d8" }
qitech_framework_tui = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="8a7ae85ffea74aa68cc533c831a0f0295fb890d8" }
qitech_framework_hub = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="8a7ae85ffea74aa68cc533c831a0f0295fb890d8" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"

# --- local patch: try_get_subdevices_vec_sync used blocking_lock() inside the
# Tokio runtime, which panics. Temporary local fix pending upstream - see
# /home/khalil/qitech_lib branch fix-blocking-lock-mixer-v2. DO NOT PUSH. ---
[patch."https://github.com/qitechgmbh/qitech_lib.git"]
ethercat_hal = { path = "/home/khalil/qitech_lib/ethercat_hal" }
ethercat_hal_derive = { path = "/home/khalil/qitech_lib/ethercat_hal_derive" }
common = { path = "/home/khalil/qitech_lib/common" }
modbus = { path = "/home/khalil/qitech_lib/modbus" }
units = { path = "/home/khalil/qitech_lib/units" }
xtrem = { path = "/home/khalil/qitech_lib/xtrem" }

# --- local patch: SubscribeMachine dropped its LifetimeTokenOwner immediately
# after use instead of storing it on the subscriber instance, so every
# RemoteProperty handed out by subscribe() expired on the very next tick.
# Temporary local fix pending upstream - see
# /home/khalil/qitech_framework branch fix-subscription-token-owner. DO NOT PUSH.
[patch."https://github.com/qitechgmbh/qitech_framework.git"]
qitech_framework = { path = "/home/khalil/qitech_framework/qitech_framework" }
qitech_framework_core = { path = "/home/khalil/qitech_framework/qitech_framework_core" }
qitech_framework_tui = { path = "/home/khalil/qitech_framework/qitech_framework_tui" }
qitech_framework_hub = { path = "/home/khalil/qitech_framework/qitech_framework_hub" }
qitech_framework_macros = { path = "/home/khalil/qitech_framework/qitech_framework_macros" }