[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="11d7d3bf7dac6991e6b7644a42b9658e6ffa8481" }
# --- framework ---
qitech_framework = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="1de2a520cec48f116080bff63d2e058b38939bc0" }
qitech_framework_tui = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="1de2a520cec48f116080bff63d2e058b38939bc0" }
qitech_framework_hub = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="1de2a520cec48f116080bff63d2e058b38939bc0" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
