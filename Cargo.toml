[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="3f91c69253a0d5338007eb3e8438b41df7b39124" }
qitech_framework = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="f6ccf856e39595342ebb266afcbd11d353038227" }
qitech_framework_tui = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="f6ccf856e39595342ebb266afcbd11d353038227" }
qitech_framework_hub = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="f6ccf856e39595342ebb266afcbd11d353038227" }

tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"