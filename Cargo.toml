[workspace]
members = ["qitech_control"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"

[workspace.dependencies]
# --- lib ---
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="530355c00baf6335f6085441c2a497d9ac060af6" }

# --- framework ---
qitech_framework = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="812babfe83dd4d14a3e16d40e1174b5b4718e017" }
qitech_framework_tui = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="812babfe83dd4d14a3e16d40e1174b5b4718e017" }
qitech_framework_hub = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="812babfe83dd4d14a3e16d40e1174b5b4718e017" }

[workspace.lints.clippy]
# don't lint poissbilities for let chains because they were introduces after Rust 1.86
collapsible_if = "allow"

# Lint groups (priority -1)
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pendantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
