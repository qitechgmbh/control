[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git="https://github.com/qitechgmbh/qitech_lib", rev="bed88e04a957c346ae977587b496566ccd713037" }

# --- framework ---
qitech_framework = { git="https://github.com/qitechgmbh/qitech_framework", rev="2d58c7f3cd5b5a8d2643f2b1463d2879d045fd55" }
qitech_framework_tui = { git="https://github.com/qitechgmbh/qitech_framework", rev="2d58c7f3cd5b5a8d2643f2b1463d2879d045fd55" }
qitech_framework_hub = { git="https://github.com/qitechgmbh/qitech_framework", rev="2d58c7f3cd5b5a8d2643f2b1463d2879d045fd55" }


# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
