[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git="https://github.com/qitechgmbh/qitech_lib", rev="2a8be269ab3c324014d15dad6ee86a850253dcdf" }

# --- framework ---
qitech_framework = { git="https://github.com/qitechgmbh/qitech_framework", rev="e8b864214f32cc53cede0a11500d80592ad70cd9" }
qitech_framework_tui = { git="https://github.com/qitechgmbh/qitech_framework", rev="e8b864214f32cc53cede0a11500d80592ad70cd9" }
qitech_framework_hub = { git="https://github.com/qitechgmbh/qitech_framework", rev="e8b864214f32cc53cede0a11500d80592ad70cd9" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
