[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { path = "/home/rob/dev/qit/qitech_lib" }

# --- framework ---
qitech_framework = { path = "/home/rob/dev/qit/qitech_framework/qitech_framework"  }
qitech_framework_tui = { path = "/home/rob/dev/qit/qitech_framework/qitech_framework_tui" }
qitech_framework_hub = { path = "/home/rob/dev/qit/qitech_framework/qitech_framework_hub" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
