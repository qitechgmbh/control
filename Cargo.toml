[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git="https://github.com/qitechgmbh/qitech_lib", rev="d38f84f0d153ee4445b442839950fc1f140112e4" }

# --- framework ---
qitech_framework = { git="https://github.com/qitechgmbh/qitech_framework", rev="193e256f8b48e5a0d8094981b61b1b2664ec3e24" }
qitech_framework_tui = { git="https://github.com/qitechgmbh/qitech_framework", rev="193e256f8b48e5a0d8094981b61b1b2664ec3e24" }
qitech_framework_hub = { git="https://github.com/qitechgmbh/qitech_framework", rev="193e256f8b48e5a0d8094981b61b1b2664ec3e24" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"
