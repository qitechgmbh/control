[workspace]
members = ["qitech_control", "qitech_control_core"]
exclude = []
resolver = "2"

[workspace.package]
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
keywords = ["ethercat", "modbus", "machine"]
categories = [""]
exclude = [".github", ".vscode"]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
# --- internal ---
qitech_control = { path = "qitech_control" }
qitech_control_core = { path = "qitech_control_core" }

# --- lib ---
qitech_lib = { git = "https://github.com/qitechgmbh/qitech_lib.git", rev="af551bce873a54085ef247373272bc0b5975edf3" }

# --- framework ---
qitech_framework = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="2d566a80566260f6401c0c9fb10b19b16c60d35a" }
qitech_framework_tui = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="2d566a80566260f6401c0c9fb10b19b16c60d35a" }
qitech_framework_hub = { git = "https://github.com/qitechgmbh/qitech_framework.git", rev="2d566a80566260f6401c0c9fb10b19b16c60d35a" }

# --- external ---
tokio = "1"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-subscriber = "0.3"