[package]
name = "control_core"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.103"

axum = "0.8.9"

qitech_lib = { workspace = true }
ethercrab = { git = "https://github.com/v-morlock/ethercrab", branch = "main" }
interfaces = "0.0.9"
serde = { version = "1.0.219", features = ["derive"] }
serialport = "4.7.3"
smol = "2.0.2"
socketioxide = "0.15.2"
tokio = { version = "1.50.0", features = ["sync"] }
bitvec = { version = "1.0.1", features = ["alloc"] }
crc = "3.3.0"
tracing = "0.1.44"
erased-serde = "0.4.10"
core_affinity = "0.8.3"


# Semidefinite solver for the iterated-LMI MIMO synthesis. Optional and off by default: its PSD
# cone support is not pure Rust (`sdp = [blas, lapack, indexmap]`), so enabling it pulls a
# BLAS/LAPACK implementation into the build. The BLAS backend is picked per platform because there
# is no single one that works everywhere: Accelerate is system-provided on macOS, OpenBLAS is what
# the NixOS deployment carries.
[target.'cfg(target_os = "macos")'.dependencies]
clarabel = { version = "0.11", features = ["sdp-accelerate"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
clarabel = { version = "0.11", features = ["sdp-openblas"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
approx = "0.5.1"
textplots = "0.8"

[features]
default = []
# Iterated-LMI MIMO PID synthesis. See controllers/mimo/synth_lmi.rs.
mimo-lmi = ["dep:clarabel"]

[package.metadata.cargo-machete]
ignored =  ["axum","bitvec","control_core_derive"]
