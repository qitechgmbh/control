name: Nix CI

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

permissions:
  contents: read

jobs:
  electron:
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@v7

      - &nix-install
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - &cachix
        uses: cachix/cachix-action@v17
        with:
          name: qitech
          authToken: '${{ secrets.CACHIX_TOKEN }}'

      - name: Build Electron in Nix
        run: nix build -L .#packages.x86_64-linux.electron

  rust:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *nix-install
      - *cachix

      - name: Build Server in Nix
        run: nix build -L .#packages.x86_64-linux.server

  build:
    runs-on: ubuntu-latest
    needs: [electron, rust]

    steps:
      - *checkout
      - *nix-install

      - uses: cachix/cachix-action@v17
        with:
          name: qitech
          skipPush: true

      - name: Build Flake and System Configuration
        run: ./nixos-build-iso.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: result/iso/*.iso
          archive: false

  format:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *nix-install

      - name: Format
        run: nix fmt -- --fail-on-change

  nix-check:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *nix-install

      - name: Build Flake and Configuration.nix
        run: nix flake check --impure
