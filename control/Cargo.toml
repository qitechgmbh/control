[package]
name = "qitech_machines"
version = "0.1.0"
edition = "2024"

[dependencies]
qitech_framework = { path = "../library" }
qitech_framework_tui = { path = "../tui" }

# --- workspace deps ---
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
qitech_lib = { workspace = true }

# --- unique deps ---
postcard = { version = "1.1.3", features = ["alloc"]}
heapless = { version = "0.8.0", features = ["serde"]}
serialport = "4.9.0"
udev = "0.9.3"
euclid = "0.22.13"
bitvec = "1.1.1"
libc = "0.2.186"

[dev-dependencies]
approx = "0.5.1"

[features]
mock-machine = []