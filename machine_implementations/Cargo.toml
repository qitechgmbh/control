[package]
name = "machine_implementations"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
qitech_lib = { workspace = true }
control_core = { path = "../control-core" }

anyhow = "1.0.103"
serde = { version = "1.0.217", features = ["derive"] }
bitvec = "1.0.1"
lazy_static = "1.5.0"
euclid = "0.22.13"

tokio = { version = "1.50.0", features = ["sync"] }

# web
serde_json = "1.0.149"
#tracing
tracing = { version = "0.1.44", features = ["attributes"] }
tonic = { version = "0.13.1", optional = true }

postcard = { version = "1.0", features = ["alloc"] }

[dev-dependencies]
approx = "0.5.1"
textplots = "0.8"

[features]
default = ["tracing-fmt"]
never_type = []
tracing-fmt = []
mock-machine = []
memory-locking = []
io-uring = []
development-build = []
# Offline thermal simulation of the extruder heating zones. Test-only in
# practice; also built under `cfg(test)`, so `cargo test` covers it.
simulation = []

[[example]]
name = "extruder_thermal_sim"
required-features = ["simulation"]

[[example]]
name = "bench_heating"
required-features = ["simulation"]

[package.metadata.cargo-machete]
ignored =  ["tonic"]
