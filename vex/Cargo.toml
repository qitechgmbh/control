[package]
name = "vex"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"
repository = "https://github.com/qitechgmbh/control"
description = "CycloneDX VEX (Vulnerability Exploitability eXchange) generator"

[[bin]]
name = "vex"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
